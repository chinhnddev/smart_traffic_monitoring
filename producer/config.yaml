youtube_url: "https://www.youtube.com/watch?v=5WN2PJ_Qxjs"
video_source: "youtube"
frame_interval: 0.5      # seconds between frames

kafka_broker: "kafka:29092,kafka-2:29093"
topic: "video_frames"
location_id: "location_1"

max_retries: 5
retry_delay: 2

# Database configuration for pipeline control flag
db_host: "postgres"
db_port: 5432
db_name: "crowd_db"
db_user: "crowd_user"
db_password: "crowd_pass"
